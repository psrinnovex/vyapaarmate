<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1321" />
    <title>VyapaarMate is offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #eef4f8; color: #0d1321; }
      main { width: min(100%, 440px); padding: 30px; border: 1px solid #dbe5ec; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 24px 70px rgb(13 19 33 / 12%); }
      img { width: 64px; height: 64px; border-radius: 18px; }
      h1 { margin: 20px 0 0; font-size: 28px; letter-spacing: -0.03em; }
      p { margin: 12px 0 0; color: #526071; font-size: 14px; line-height: 1.7; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 22px; padding: 0 22px; border-radius: 12px; background: #087f5b; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 4px solid rgb(8 127 91 / 22%); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Reconnect to load current bookings, appointments, orders, payments, and customer data. VyapaarMate never presents stale private records as current.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
